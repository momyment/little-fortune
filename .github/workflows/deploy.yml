name: Build and deploy to GitHub Pages

# 소스(site/)가 바뀌었을 때만 Next.js 정적 빌드를 만들고, GitHub Pages가
# 읽는 main 브랜치에 결과물을 커밋한다. 운세 데이터는 api/v1/*.json 으로
# 따로 올라가며, 페이지가 런타임에 가져가므로 데이터만 바뀌면 리빌드하지 않는다.
#
# Pages 설정은 main 브랜치 루트(/)를 배포하는 legacy 방식이다.
# actions/deploy-pages는 쓰지 않는다. 수동 실행에서 아티팩트 업로드는
# 됐지만 deploy-pages가 곧바로 아티팩트를 찾지 못했고, 예전에
# deploy-pages가 성공해도 라이브 주소는 main 루트의 파일을 보여 줬다.
#
# Daily fortune의 GITHUB_TOKEN 푸시는 이 워크플로를 시작시키지 않는다.
# 데이터가 아니라 소스(site/ 또는 이 파일)가 바뀔 때만 빌드한다.

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build static export
        working-directory: site
        run: npm run build

      - name: Commit built pages to main
        # 별자리 페이지만 site/에서 빌드한다. 띠별 인덱스와 구 _next
        # 청크, api/ 데이터 파일은 그대로 두고 horoscope/ 와 새 청크만
        # 덮어쓴다. 이 커밋은 GITHUB_TOKEN 푸시라 deploy.yml을 다시
        # 시작하지는 않지만, pages-build-deployment는 main 푸시를 받아
        # 라이브 주소에 올린다.
        run: |
          test -d site/out/horoscope
          rm -rf horoscope
          cp -r site/out/horoscope horoscope
          if [ -d site/out/_next ]; then
            cp -a site/out/_next/. _next/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horoscope _next
          if git diff --cached --quiet; then
            echo "No built pages to commit."
          else
            git commit -m "Rebuild horoscope pages" -m "Built from site/ (code change)."
            git pull --rebase origin main
            git push origin main
          fi
